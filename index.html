<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Treo</title>
<style>
  /* Treo — futuristic HUD. Committed dark theme. */
  :root{
    --bg:#05070d; --bg2:#0a0e17; --panel:rgba(18,26,40,.72); --panel-2:rgba(24,34,52,.6);
    --line:rgba(120,180,255,.14); --line-2:rgba(120,180,255,.28);
    --ink:#eaf2ff; --ink-2:#9db2d4; --muted:#5f728f;
    --glow:#39d0ff; --glow-2:#4aa8ff; --cyan:#39d0ff;
    --good:#22e39a; --good-ink:#22e39a; --bad:#ff5d6c; --warn:#ffcf5a;
    --series-1:#4aa8ff;
  }
  *{box-sizing:border-box}
  html,body{background:var(--bg)}
  body{margin:0;color:var(--ink);font:14px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;
    background:
      radial-gradient(1100px 600px at 50% -10%, rgba(57,208,255,.10), transparent 60%),
      radial-gradient(900px 500px at 90% 20%, rgba(74,168,255,.07), transparent 55%),
      var(--bg);
    min-height:100vh}
  .mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
  h1{font-size:17px;margin:0;letter-spacing:3px;font-weight:800}
  h2{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin:26px 0 10px;font-weight:700}
  .wrap{max-width:1160px;margin:0 auto;padding:0 20px 50px}
  .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .spacer{flex:1}
  .pos{color:var(--good-ink)} .neg{color:var(--bad)} .mut{color:var(--muted)}

  .appbar{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,rgba(7,11,20,.92),rgba(7,11,20,.72));
    border-bottom:1px solid var(--line);backdrop-filter:blur(10px)}
  .appbar .inner{max-width:1160px;margin:0 auto;padding:12px 20px}
  .brand{display:flex;align-items:center;gap:11px}
  .mark{font-weight:800;letter-spacing:4px;font-size:18px;
    background:linear-gradient(90deg,var(--glow),#8ad9ff);-webkit-background-clip:text;background-clip:text;color:transparent}
  .spark{width:11px;height:11px;border-radius:50%;background:var(--glow);box-shadow:0 0 12px 2px var(--glow);animation:pulse 1.7s infinite}
  @keyframes pulse{0%{box-shadow:0 0 8px 1px var(--glow)}50%{box-shadow:0 0 16px 5px var(--glow)}100%{box-shadow:0 0 8px 1px var(--glow)}}
  .badge{display:inline-block;padding:3px 11px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:.05em;
    border:1px solid var(--line-2)}
  .b-run{color:var(--good-ink)} .b-pause{color:var(--warn)} .b-halt{color:var(--bad)} .b-mode{color:var(--cyan)}
  button{font:inherit;cursor:pointer;border:1px solid var(--line-2);background:rgba(30,44,68,.5);color:var(--ink);
    padding:7px 13px;border-radius:10px;transition:.14s;letter-spacing:.02em}
  button:hover{border-color:var(--glow);box-shadow:0 0 12px rgba(57,208,255,.25)}
  button.primary{background:linear-gradient(90deg,var(--glow-2),var(--glow));color:#04121c;border-color:transparent;font-weight:700}
  button.mini{padding:5px 11px;font-size:12px}
  button.on{border-color:var(--glow);color:var(--glow);box-shadow:0 0 12px rgba(57,208,255,.25)}
  input,select{font:inherit;color:var(--ink);background:rgba(10,16,26,.7);border:1px solid var(--line-2);border-radius:9px;padding:8px 10px;width:100%}
  input:focus{outline:none;border-color:var(--glow);box-shadow:0 0 0 3px rgba(57,208,255,.15)}

  .tabs{display:flex;gap:4px;margin-top:12px;flex-wrap:wrap}
  .tab{padding:8px 16px;border-radius:10px;font-weight:600;font-size:13px;color:var(--ink-2);cursor:pointer;
    letter-spacing:.03em;border:1px solid transparent}
  .tab:hover{background:rgba(57,208,255,.08)}
  .tab.active{color:var(--glow);border-color:var(--line-2);background:rgba(57,208,255,.10);box-shadow:0 0 14px rgba(57,208,255,.18) inset}

  .glass{background:var(--panel);border:1px solid var(--line);border-radius:16px;backdrop-filter:blur(8px)}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
  .card{padding:14px 16px}
  .card .k{color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.08em}
  .card .v{font-size:23px;font-weight:750;margin-top:5px;font-variant-numeric:tabular-nums}
  .panel{padding:16px}

  /* ---------- ARC REACTOR HUD ---------- */
  .hud{display:grid;grid-template-columns:1fr;place-items:center;padding:26px 0 6px}
  .reactor{position:relative;width:300px;height:300px;filter:drop-shadow(0 0 30px rgba(57,208,255,.35))}
  .reactor .ring{position:absolute;border-radius:50%}
  .r-tick{inset:0;border:1px dashed rgba(120,200,255,.25);
    -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 26px),#000 calc(100% - 26px));
    mask:radial-gradient(farthest-side,transparent calc(100% - 26px),#000 calc(100% - 26px));
    animation:spin 26s linear infinite}
  .r-sweep{inset:18px;background:conic-gradient(from 0deg,transparent 0 55%,rgba(57,208,255,.55) 78%,var(--glow) 90%,transparent 100%);
    -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 10px),#000 calc(100% - 10px));
    mask:radial-gradient(farthest-side,transparent calc(100% - 10px),#000 calc(100% - 10px));
    animation:spin 3.2s linear infinite}
  .r-sweep.rev{inset:40px;animation:spin 5.5s linear infinite reverse;opacity:.6}
  .r-inner{inset:66px;border:1px solid rgba(120,200,255,.35);box-shadow:0 0 22px rgba(57,208,255,.25) inset}
  @keyframes spin{to{transform:rotate(360deg)}}
  .core{position:absolute;inset:82px;border-radius:50%;display:grid;place-items:center;text-align:center;
    background:radial-gradient(circle at 50% 42%, rgba(57,208,255,.35), rgba(10,20,36,.9) 70%);
    box-shadow:0 0 40px rgba(57,208,255,.4) inset, 0 0 26px rgba(57,208,255,.3);
    animation:breathe 3.4s ease-in-out infinite}
  @keyframes breathe{0%,100%{box-shadow:0 0 40px rgba(57,208,255,.35) inset,0 0 20px rgba(57,208,255,.25)}
    50%{box-shadow:0 0 60px rgba(57,208,255,.6) inset,0 0 34px rgba(57,208,255,.45)}}
  .core.long{background:radial-gradient(circle at 50% 42%, rgba(34,227,154,.4), rgba(8,26,20,.92) 70%);
    box-shadow:0 0 60px rgba(34,227,154,.55) inset,0 0 34px rgba(34,227,154,.5)}
  .core.short{background:radial-gradient(circle at 50% 42%, rgba(255,93,108,.4), rgba(30,10,14,.92) 70%);
    box-shadow:0 0 60px rgba(255,93,108,.5) inset,0 0 34px rgba(255,93,108,.45)}
  .core.halt{background:radial-gradient(circle at 50% 42%, rgba(255,207,90,.3), rgba(30,24,10,.92) 70%)}
  .tag{font-size:10px;font-weight:800;padding:2px 7px;border-radius:6px;letter-spacing:.04em}
  .tag.long{background:rgba(34,227,154,.16);color:var(--good)} .tag.short{background:rgba(255,93,108,.16);color:var(--bad)}
  .core-state{font-weight:800;letter-spacing:3px;font-size:20px}
  .core-sub{font-size:11px;color:var(--ink-2);margin-top:3px;letter-spacing:.06em;max-width:150px}
  .notice{margin-top:6px;text-align:center;color:var(--ink-2);font-size:13px;min-height:1.4em}
  .notice b{color:var(--glow)}

  /* satellites */
  .sats{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
  .sat{min-width:120px;padding:10px 12px;border-radius:13px;border:1px solid var(--line);background:var(--panel-2);text-align:center;transition:.15s}
  .sat.long{border-color:var(--good);box-shadow:0 0 16px rgba(34,227,154,.35)}
  .sat.short{border-color:var(--bad);box-shadow:0 0 16px rgba(255,93,108,.35)}
  .sat .s{font-weight:700;font-size:13px}
  .sat .p{font-variant-numeric:tabular-nums;color:var(--ink-2);font-size:12px;margin-top:2px}
  .dots{display:flex;gap:4px;justify-content:center;margin-top:7px}
  .d{width:7px;height:7px;border-radius:50%;background:rgba(120,150,190,.3)}
  .d.on{background:var(--good);box-shadow:0 0 7px var(--good)}

  .ticker{margin-top:6px;padding:9px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel-2);
    font-size:12.5px;color:var(--ink-2);display:flex;gap:9px;align-items:center}
  .ticker .fdot{width:7px;height:7px;border-radius:50%;background:var(--glow);box-shadow:0 0 8px var(--glow);flex:none}

  table{width:100%;border-collapse:collapse}
  th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);font-size:13px;font-variant-numeric:tabular-nums}
  th{color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;font-weight:700}
  .tblwrap{overflow-x:auto}
  .charts{display:grid;grid-template-columns:2fr 1fr;gap:12px}
  @media(max-width:820px){.charts{grid-template-columns:1fr}}
  .charts .panel{height:300px;display:flex;flex-direction:column;gap:8px}
  .charts .panel canvas{flex:1 1 auto;min-height:0}
  .chip{font-size:11px;font-weight:700;padding:3px 8px;border-radius:7px;background:rgba(120,150,190,.14);color:var(--muted)}
  .chip.ok{background:rgba(34,227,154,.16);color:var(--good-ink)}
  .field label{display:block;font-size:12px;color:var(--ink-2);margin-bottom:4px}
  .form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
  .filterbar{display:flex;gap:6px;margin-bottom:12px}
  #login{max-width:390px;margin:12vh auto;text-align:center}
  #login .panel{padding:28px}
  .hint{color:var(--muted);font-size:12px;margin-top:10px}
  .saved{color:var(--good-ink);font-size:13px;margin-left:8px}
  .feed{max-height:300px;overflow-y:auto;padding:4px}
  .frow{display:flex;gap:10px;padding:6px 8px;border-bottom:1px solid var(--line);font-size:12px;align-items:baseline}
  .frow:last-child{border-bottom:none}
  .ftime{color:var(--muted);font-size:11px;white-space:nowrap}
  .fsym{font-weight:700;min-width:72px}
  .ftxt{color:var(--ink-2);flex:1}
  canvas{max-width:100%}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login" hidden>
  <div class="glass panel">
    <div class="brand" style="justify-content:center"><span class="spark"></span><span class="mark">TREO</span></div>
    <p class="mut" style="margin:10px 0 20px;letter-spacing:.05em">AUTONOMOUS TRADING · SIGN IN</p>
    <div class="field" style="text-align:left"><label>Email</label>
      <input id="email" type="email" placeholder="you@example.com"></div>
    <div class="field" style="text-align:left;margin-top:10px"><label>Password</label>
      <input id="password" type="password" placeholder="your password" onkeydown="if(event.key==='Enter')signIn()"></div>
    <button class="primary" style="width:100%;margin-top:16px" onclick="signIn()">Enter</button>
    <p class="hint" id="loginMsg">Use the email &amp; password you set up in Supabase.</p>
  </div>
</div>

<!-- APP -->
<div id="app" hidden>
  <div class="appbar"><div class="inner row">
    <div class="brand"><span class="spark"></span><span class="mark">TREO</span></div>
    <span id="mode" class="badge b-mode">—</span>
    <span id="status" class="badge b-run">—</span>
    <span class="spacer"></span>
    <button class="mini" onclick="setControl('run')">Run</button>
    <button class="mini" onclick="setControl('pause')">Pause</button>
    <button class="mini" onclick="setControl('stop')">Stop</button>
    <button class="mini" onclick="signOut()">Exit</button>
  </div>
  <div class="inner" style="padding-top:0"><div class="tabs" id="tabs"></div></div></div>

  <div class="wrap"><div id="view"></div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="config.js"></script>
<script>
const cfg=window.APP_CONFIG;
const sb=window.supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY);
const TABS=["Command","Trades","Markets","Settings"];
let active="Command", S={}, T=[], pnlChart, wlChart;
const FIELDS=[
  ["symbols","Pairs (comma separated)","text"],["timeframe","Candle timeframe","text"],
  ["poll_seconds","Check every (seconds)","number"],["leverage","Leverage (×)","number"],
  ["allow_long","Allow longs","bool"],["allow_short","Allow shorts","bool"],
  ["score_threshold","Votes needed (2–4)","number"],["atr_mult","Stop = ATR ×","number"],
  ["risk_per_trade_pct","Risk per trade (%)","number"],["reward_risk","Reward : risk","number"],
  ["max_open_positions","Max open positions","number"],["daily_loss_limit_pct","Daily loss limit (%)","number"],
  ["daily_profit_target_pct","Daily profit target (%)","number"],["ema_fast","EMA fast","number"],
  ["ema_slow","EMA slow","number"],["rsi_period","RSI period","number"],
  ["atr_period","ATR period","number"],["min_notional_usdt","Min trade size (USDT)","number"],
];
const DEFAULTS={symbols:'BTC/USDT, ETH/USDT, SOL/USDT, BNB/USDT, XRP/USDT',timeframe:'5m',poll_seconds:10,
  leverage:1,allow_long:true,allow_short:true,score_threshold:3,atr_mult:1.5,risk_per_trade_pct:1,reward_risk:1.5,
  max_open_positions:2,daily_loss_limit_pct:3,daily_profit_target_pct:4,ema_fast:9,ema_slow:21,rsi_period:14,
  atr_period:14,min_notional_usdt:11};
function css(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim()}
function fmt(n){return n==null?'—':Number(n).toLocaleString(undefined,{maximumFractionDigits:8})}

async function signIn(){const email=email_.value.trim(),password=password_.value;
  if(!email||!password){loginMsg.textContent="Enter your email and password.";return;}
  const {error}=await sb.auth.signInWithPassword({email,password});
  if(error)loginMsg.textContent="Error: "+error.message;}
async function signOut(){await sb.auth.signOut();location.reload();}
async function boot(){const {data:{session}}=await sb.auth.getSession(); session?showApp():(login.hidden=false);}
sb.auth.onAuthStateChange((_e,s)=>{if(s)showApp();});

let lastTLen=-1;
async function showApp(){
  login.hidden=true; app.hidden=false;
  tabs.innerHTML=TABS.map(t=>`<div class="tab ${t===active?'active':''}" onclick="go('${t}')">${t}</div>`).join('');
  await Promise.all([fetchState(),fetchTrades()]); build();
  sb.channel('rt')
    .on('postgres_changes',{event:'*',schema:'public',table:'bot_state'},async()=>{await fetchState();live();})
    .on('postgres_changes',{event:'*',schema:'public',table:'trades'},async()=>{await fetchTrades();live();})
    .subscribe();
  setInterval(async()=>{await fetchState();live();},5000);
}
function go(t){active=t;document.querySelectorAll('.tab').forEach(el=>el.classList.toggle('active',el.textContent===t));build();}
async function fetchState(){const {data}=await sb.from('bot_state').select('data').eq('id',1).single();S=(data&&data.data)||{};}
async function fetchTrades(){const {data}=await sb.from('trades').select('*').order('created_at',{ascending:true}).limit(1000);T=data||[];lastTLen=T.length;}

function syncHeader(){
  mode.textContent=S.mode||'—';
  if(S.control==='pause'){status.className='badge b-pause';status.textContent='PAUSED';}
  else if(S.halted){status.className='badge b-halt';status.textContent='HALTED';}
  else{status.className='badge b-run';status.textContent='ONLINE';}
}
// FULL build of the active tab (on tab switch / first load)
function build(){
  syncHeader();
  view.innerHTML=({Command:vCommand,Trades:vTrades,Markets:vMarkets,Settings:vSettings}[active])();
  if(active==='Command')syncCommand();
  if(active==='Trades'){drawPnl();drawWL();syncTrades();}
  if(active==='Markets')syncMarkets();
  if(active==='Settings')fillSettings();
}
// LIGHT update on live data — never disturbs the Settings form or the reactor DOM
function live(){
  syncHeader();
  if(active==='Settings') return;                 // leave the form alone while editing
  if(active==='Command'){ syncCommand(); return; }// update readouts, reactor keeps spinning
  if(active==='Markets'){ syncMarkets(); return; }
  if(active==='Trades'){ if(T.length!==lastTLen){lastTLen=T.length;drawPnl();drawWL();} syncTrades(); }
}

// headline: what is Treo noticing?
function headline(){
  const sig=S.signals||{}, keys=Object.keys(sig);
  const hotK=keys.find(k=>sig[k].signal);
  if(S.halted) return {state:'HALTED',cls:'halt',sub:S.halt_reason||'stood down',note:S.halt_reason||''};
  if(S.control==='pause') return {state:'PAUSED',cls:'halt',sub:'holding',note:'Trading paused'};
  if(hotK){const dir=sig[hotK].signal;
    return {state:dir.toUpperCase(),cls:dir,sub:hotK,
      note:`<b>${hotK}</b> — confluence aligned, entering <b>${dir}</b>`};}
  // closest to a signal (highest single-side score)
  let best=null,bc=-1,bd='';
  keys.forEach(k=>{const s=sig[k].score||{long:0,short:0};const m=Math.max(s.long,s.short);
    if(m>bc){bc=m;best=k;bd=s.long>=s.short?'long':'short';}});
  const sub=keys.length?`${keys.length} markets`:'connecting';
  const note=best!=null?`Closest: <b>${best}</b> — ${bc}/4 ${bd} votes`:'Scanning the markets…';
  return {state:'SCANNING',cls:'',sub,note};
}

// Static skeleton — the reactor rings live here and are NEVER rebuilt on refresh,
// so their CSS animation keeps spinning continuously.
function vCommand(){
  return `<div class="hud">
    <div class="reactor">
      <div class="ring r-tick"></div><div class="ring r-sweep"></div><div class="ring r-sweep rev"></div>
      <div class="ring r-inner"></div>
      <div class="core" id="coreEl"><div><div class="core-state" id="coreState">—</div>
        <div class="core-sub" id="coreSub"></div></div></div>
    </div>
    <div class="notice" id="notice"></div>
    <div class="sats" id="sats"></div>
    <div id="tickerBox"></div>
  </div>
  <div class="cards" id="kpis" style="margin-top:20px"></div>
  <p class="mut" id="cmdfoot" style="margin-top:12px;font-size:12px"></p>`;
}
// Update only the readouts in place; the reactor DOM is untouched.
function syncCommand(){
  const el=id=>document.getElementById(id);
  if(!el('coreEl')) return;
  const h=headline(), sig=S.signals||{}, pnl=S.day_pnl_pct||0, c=pnl>=0?'pos':'neg';
  el('coreEl').className='core '+h.cls;
  el('coreState').textContent=h.state;
  el('coreSub').textContent=h.sub;
  el('notice').innerHTML=h.note;
  el('sats').innerHTML=Object.keys(sig).map(s=>{const o=sig[s];const sc=o.score||{long:0,short:0};
    const lean=sc.long>sc.short?'long':(sc.short>sc.long?'short':'—');const m=Math.max(sc.long,sc.short);
    const tag=lean==='—'?'<span class="mut" style="font-size:11px">flat</span>':
      `<span class="tag ${lean}">${lean==='long'?'▲ LONG':'▼ SHORT'} ${m}/4</span>`;
    return `<div class="sat ${o.signal||''}"><div class="s">${s.replace('/USDT','')}</div>
      <div class="p">${fmt(o.price)}</div><div style="margin-top:7px">${tag}</div></div>`;}).join('')
    ||'<span class="mut">connecting…</span>';
  const last=(S.activity||[]).slice().reverse().find(a=>a.kind==='trade')||(S.activity||[]).slice(-1)[0];
  el('tickerBox').innerHTML=last?`<div class="ticker"><span class="fdot"></span>
    <span class="mono">${(last.t||'').slice(11)}</span><span>${last.symbol||''} — ${last.text||''}</span></div>`:'';
  el('kpis').innerHTML =
    card('Balance (USDT)',(S.balance||0).toFixed(2))+
    card('Today P&L',`<span class="${c}">${pnl>=0?'+':''}${pnl.toFixed(2)}%</span>`)+
    card('Open',(S.open_count||0)+' / '+(S.max_positions??'—'))+
    card('Win rate',S.win_rate!=null?S.win_rate+'%':'—')+
    card('Scans',S.cycles||0);
  el('cmdfoot').textContent=`${(S.market_type||'futures')} · ${S.leverage||1}× · long+short · `+
    `watching ${Object.keys(sig).length} markets · every ${S.poll_seconds||'—'}s on ${S.timeframe||'—'} · ${ago(S.updated)}`;
}

function vTrades(){   // skeleton — charts persist, data fills via syncTrades
  return `<h2>Open now</h2><div id="topen"></div>
    <h2>Performance</h2>
    <div class="charts">
      <div class="glass panel"><strong style="font-size:13px">Cumulative P&amp;L (%)</strong><canvas id="pnlChart"></canvas></div>
      <div class="glass panel"><strong style="font-size:13px">Win / loss</strong><canvas id="wlChart"></canvas>
        <p class="mut" id="wlNote" style="text-align:center;margin:0"></p></div></div>
    <h2>Stats</h2><div class="cards" id="tstats"></div>
    <h2>Closed trades</h2>
    <div class="filterbar">
      <button class="mini ${tf==='all'?'on':''}" onclick="setTf('all')">All</button>
      <button class="mini ${tf==='wins'?'on':''}" onclick="setTf('wins')">Wins</button>
      <button class="mini ${tf==='losses'?'on':''}" onclick="setTf('losses')">Losses</button></div>
    <div class="glass panel tblwrap" id="thist"></div>`;
}
let tf='all'; function setTf(f){tf=f;syncTrades();document.querySelectorAll('.filterbar .mini').forEach(b=>b.classList.toggle('on',b.textContent.toLowerCase()===f));}
function syncTrades(){
  const el=id=>document.getElementById(id); if(!el('tstats'))return;
  // open positions (live) — so you can see what Treo is holding right now
  const p=S.positions||{}; const pk=Object.keys(p);
  el('topen').innerHTML = pk.length? `<div class="glass panel tblwrap"><table>
    <tr><th>Pair</th><th>Side</th><th>Entry</th><th>Stop</th><th>Target</th><th>Now</th><th>Unreal.</th></tr>`+
    pk.map(s=>{const o=p[s];const side=o.side||'long';const u=o.unreal_pct||0;const c=u>=0?'pos':'neg';
      return `<tr><td>${s}</td><td class="${side==='long'?'pos':'neg'}"><b>${side.toUpperCase()}</b></td>
        <td>${fmt(o.entry)}</td><td>${fmt(o.stop)}</td><td>${fmt(o.target)}</td><td>${fmt(o.now)}</td>
        <td class="${c}">${u>=0?'+':''}${(+u).toFixed(2)}%</td></tr>`;}).join('')+`</table></div>`
    : '<p class="mut" style="padding:8px">No open positions right now — Treo opens one when a setup clears the vote threshold.</p>';
  // stats
  const wins=T.filter(x=>+x.pnl_pct>0),losses=T.filter(x=>+x.pnl_pct<=0);
  const avg=a=>a.length?(a.reduce((s,x)=>s+ +x.pnl_pct,0)/a.length):0;
  const net=T.reduce((s,x)=>s+ +x.pnl_pct,0);
  el('tstats').innerHTML=card('Total',T.length)+card('Win rate',T.length?Math.round(wins.length/T.length*100)+'%':'—')+
    card('Avg win',`<span class="pos">+${avg(wins).toFixed(2)}%</span>`)+
    card('Avg loss',`<span class="neg">${avg(losses).toFixed(2)}%</span>`)+
    card('Net (sum %)',`<span class="${net>=0?'pos':'neg'}">${net>=0?'+':''}${net.toFixed(2)}%</span>`);
  // closed history
  let rows=T.slice().reverse();
  if(tf==='wins')rows=rows.filter(x=>+x.pnl_pct>0); if(tf==='losses')rows=rows.filter(x=>+x.pnl_pct<=0);
  el('thist').innerHTML=rows.length?`<table><tr><th>Time</th><th>Pair</th><th>Entry</th><th>Exit</th><th>Result</th><th>P&L</th><th>Why</th></tr>`+
    rows.map(x=>{const c=+x.pnl_pct>=0?'pos':'neg';return `<tr><td class="mut">${x.ts||''}</td><td>${x.symbol}</td>
      <td>${fmt(x.entry)}</td><td>${fmt(x.exit)}</td><td>${x.result}</td>
      <td class="${c}">${+x.pnl_pct>=0?'+':''}${(+x.pnl_pct).toFixed(2)}%</td><td class="mut">${x.reason||''}</td></tr>`;}).join('')+`</table>`
    : '<p class="mut" style="padding:8px">No <b>closed</b> trades yet. A trade appears here only once it hits its stop or target — check "Open now" above for live positions.</p>';
}

function vMarkets(){ return `<h2>Markets</h2><div id="marketsBox"></div>`; }
function syncMarkets(){
  const box=document.getElementById('marketsBox'); if(!box)return;
  const sig=S.signals||{};
  const rows=Object.keys(sig).map(s=>{const o=sig[s],ind=o.indicators||{},sc=o.score||{long:0,short:0};
    const lean=sc.long>sc.short?'long':(sc.short>sc.long?'short':'—');const m=Math.max(sc.long,sc.short);
    const bias=lean==='—'?'<span class="mut">flat</span>':`<span class="${lean==='long'?'pos':'neg'}">${lean==='long'?'▲':'▼'} ${lean} ${m}/4</span>`;
    const read=o.signal?`<span class="${o.signal==='long'?'pos':'neg'}"><b>${o.signal.toUpperCase()}</b></span>`:`<span class="mut">${o.reason||''}</span>`;
    return `<tr><td><b>${s}</b></td><td>${fmt(o.price)}</td>
      <td class="${ind.trend==='up'?'pos':'neg'}">${ind.trend==='up'?'▲ up':(ind.trend==='down'?'▽ down':'—')}</td>
      <td>${o.rsi!=null?o.rsi:'—'}</td><td>${bias}</td><td>${read}</td></tr>`;}).join('')
    ||'<tr><td class="mut" colspan="6">Waiting for data…</td></tr>';
  box.innerHTML=`<div class="glass panel tblwrap"><table>
    <tr><th>Pair</th><th>Price</th><th>Trend</th><th>RSI</th><th>Bias (votes)</th><th>Read</th></tr>${rows}</table></div>
    <h2>Recent activity</h2><div class="glass feed mono">${
      (S.activity||[]).slice().reverse().slice(0,30).map(a=>`<div class="frow"><span class="ftime">${(a.t||'').slice(11)}</span>
        <span class="fsym">${a.symbol||''}</span><span class="ftxt">${a.text||''}</span></div>`).join('')||'<p class="mut" style="padding:8px">No activity yet.</p>'}</div>`;
}

function vSettings(){
  return `<h2>Settings <span class="mut" style="text-transform:none;letter-spacing:0">— change here, Treo applies within seconds</span></h2>
    <div class="glass panel"><div class="form-grid" id="settings"></div>
      <div class="row" style="margin-top:14px"><button class="primary" onclick="saveSettings()">Save</button>
        <span class="saved" id="savedMsg" hidden></span></div></div>
    <p class="hint">More action on the testnet? Try a shorter timeframe (1m), more pairs, or a higher RSI ceiling. More trades ≠ more profit — each pays fees.</p>`;
}
async function fillSettings(){const {data}=await sb.from('bot_config').select('data').eq('id',1).single();
  const d=(data&&data.data)||{};const box=document.getElementById('settings');if(!box)return;
  box.innerHTML=FIELDS.map(([k,label,type])=>{
    let v=d[k]; if(v==null)v=DEFAULTS[k]; if(Array.isArray(v))v=v.join(', ');
    if(type==='bool'){const on=(v===true||v==='true');
      return `<div class="field"><label>${label}</label><select id="f_${k}">
        <option value="true" ${on?'selected':''}>On</option><option value="false" ${!on?'selected':''}>Off</option></select></div>`;}
    return `<div class="field"><label>${label}</label><input id="f_${k}" type="${type}" ${type==='number'?'step="any"':''} value="${v!=null?v:''}"></div>`;}).join('');}
async function saveSettings(){const patch={};
  for(const [k,,type] of FIELDS){const el=document.getElementById('f_'+k);if(!el)continue;
    if(type==='bool'){patch[k]=el.value==='true';continue;}
    if(type==='number'){if(el.value.trim()==='')continue; patch[k]=Number(el.value);continue;}
    patch[k]=el.value;}
  const {data}=await sb.from('bot_config').select('revision').eq('id',1).single();
  const rev=((data&&data.revision)||0)+1;
  const {error}=await sb.from('bot_config').update({data:patch,revision:rev,updated_at:new Date().toISOString()}).eq('id',1);
  const m=document.getElementById('savedMsg');m.hidden=false;
  m.textContent=error?('Error: '+error.message):'Saved — Treo will pick these up shortly.';setTimeout(()=>{if(m)m.hidden=true},4000);}
async function setControl(w){await sb.from('bot_config').update({control:w,updated_at:new Date().toISOString()}).eq('id',1);}

function baseOpts(){return {responsive:true,maintainAspectRatio:false,animation:false,
  plugins:{legend:{display:false},tooltip:{backgroundColor:'#0e1626',titleColor:css('--ink'),bodyColor:css('--ink-2'),borderColor:css('--line-2'),borderWidth:1}},
  scales:{x:{grid:{color:css('--line')},ticks:{color:css('--muted'),maxTicksLimit:8},border:{color:css('--line-2')}},
          y:{grid:{color:css('--line')},ticks:{color:css('--muted')},border:{color:css('--line-2')}}}};}
function drawPnl(){const ctx=document.getElementById('pnlChart');if(!ctx)return;
  let cum=0;const labels=[],vals=[];T.forEach((x,i)=>{cum+=+x.pnl_pct||0;labels.push(i+1);vals.push(+cum.toFixed(2));});
  const line=css('--series-1');if(pnlChart)pnlChart.destroy();
  pnlChart=new Chart(ctx,{type:'line',data:{labels,datasets:[{data:vals,borderColor:line,borderWidth:2,pointRadius:0,
    pointHoverRadius:4,tension:.25,fill:true,backgroundColor:'rgba(74,168,255,.12)'}]},
    options:{...baseOpts(),interaction:{mode:'index',intersect:false}}});}
function drawWL(){const ctx=document.getElementById('wlChart');if(!ctx)return;
  const wins=T.filter(x=>+x.pnl_pct>0).length,losses=T.length-wins;
  const note=document.getElementById('wlNote');if(note)note.textContent=T.length?`${wins} wins · ${losses} losses`:'No trades yet';
  if(wlChart)wlChart.destroy();
  wlChart=new Chart(ctx,{type:'doughnut',data:{labels:['Wins','Losses'],datasets:[{data:[wins,losses],
    backgroundColor:[css('--good'),css('--bad')],borderColor:'#0a0e17',borderWidth:2}]},
    options:{responsive:true,maintainAspectRatio:false,cutout:'62%',animation:false,
      plugins:{legend:{position:'bottom',labels:{color:css('--ink-2'),boxWidth:12,padding:14}},
        tooltip:{backgroundColor:'#0e1626',titleColor:css('--ink'),bodyColor:css('--ink-2'),borderColor:css('--line-2'),borderWidth:1}}}});}

function card(k,v){return `<div class="glass card"><div class="k">${k}</div><div class="v">${v}</div></div>`}
function ago(ts){if(!ts)return 'no data yet';const t=Date.parse(ts.replace(' ','T'));if(isNaN(t))return 'updated '+ts;
  const s=Math.max(0,Math.round((Date.now()-t)/1000));return s<60?`last scan ${s}s ago`:`last scan ${Math.round(s/60)}m ago`;}

const login=document.getElementById('login'),app=document.getElementById('app'),tabs=document.getElementById('tabs'),
  view=document.getElementById('view'),mode=document.getElementById('mode'),status=document.getElementById('status'),
  email_=document.getElementById('email'),password_=document.getElementById('password'),loginMsg=document.getElementById('loginMsg');
boot();
</script>
