<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Treo</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Orbitron:wght@600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap');
:root{
  --bg:#04060c; --bg2:#070b14;
  --panel:rgba(16,24,40,.62); --panel-2:rgba(22,32,52,.5); --panel-3:rgba(30,42,66,.4);
  --line:rgba(120,180,255,.12); --line-2:rgba(120,190,255,.24); --line-3:rgba(140,200,255,.4);
  --ink:#eef4ff; --ink-2:#a7bbdd; --muted:#61789e;
  --glow:#3ce0ff; --glow-2:#4aa8ff; --cyan:#3ce0ff; --violet:#8b6cff; --violet-2:#a98cff;
  --good:#26e6a4; --good-ink:#3ff0b6; --bad:#ff5d72; --bad-ink:#ff7d8e; --warn:#ffce5a;
  --series-1:#4aa8ff; --series-2:#8b6cff;
  --shadow:0 10px 40px rgba(0,0,0,.5);
  --r:16px;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);
  font:14px/1.55 'Inter',system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;letter-spacing:.1px;
  background:
    radial-gradient(1200px 640px at 50% -12%, rgba(60,224,255,.12), transparent 62%),
    radial-gradient(1000px 560px at 88% 8%, rgba(139,108,255,.11), transparent 58%),
    radial-gradient(900px 700px at 6% 100%, rgba(74,168,255,.08), transparent 60%),
    linear-gradient(180deg,#04060c,#060a12);
  background-attachment:fixed;min-height:100vh;position:relative}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.5;
  background-image:linear-gradient(rgba(120,180,255,.045) 1px,transparent 1px),
    linear-gradient(90deg,rgba(120,180,255,.045) 1px,transparent 1px);
  background-size:44px 44px;
  -webkit-mask:radial-gradient(1100px 700px at 50% 0%,#000,transparent 80%);
  mask:radial-gradient(1100px 700px at 50% 0%,#000,transparent 80%)}
#app,#login{position:relative;z-index:1}
.mono,.tabular{font-family:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
h1{font-size:17px;margin:0;letter-spacing:3px;font-weight:800}
h2{font-family:'Inter';font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);
  margin:28px 0 12px;font-weight:700;display:flex;align-items:center;gap:10px}
h2::before{content:"";width:16px;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--glow),transparent)}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px 56px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spacer{flex:1}
.pos{color:var(--good-ink)} .neg{color:var(--bad-ink)} .mut{color:var(--muted)}
.appbar{position:sticky;top:0;z-index:30;
  background:linear-gradient(180deg,rgba(6,10,20,.92),rgba(6,10,20,.6));
  border-bottom:1px solid var(--line);backdrop-filter:blur(16px) saturate(1.3)}
.appbar .inner{max-width:1180px;margin:0 auto;padding:13px 20px}
.brand{display:flex;align-items:center;gap:12px}
.mark{font-family:'Orbitron';font-weight:800;letter-spacing:6px;font-size:19px;
  background:linear-gradient(90deg,#8ad9ff,var(--glow),var(--violet-2));-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 14px rgba(60,224,255,.35))}
.spark{width:12px;height:12px;border-radius:50%;background:var(--glow);
  box-shadow:0 0 14px 3px var(--glow);animation:pulse 1.8s infinite;position:relative}
.spark::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:1px solid rgba(60,224,255,.4);animation:ripple 2.4s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 10px 1px var(--glow)}50%{box-shadow:0 0 20px 6px var(--glow)}}
@keyframes ripple{0%{transform:scale(.6);opacity:.9}100%{transform:scale(1.5);opacity:0}}
.badge{display:inline-flex;align-items:center;padding:4px 12px;border-radius:20px;font-size:11px;font-weight:700;
  letter-spacing:.06em;border:1px solid var(--line-2);background:rgba(20,30,50,.5);backdrop-filter:blur(4px)}
.b-run{color:var(--good-ink);border-color:rgba(38,230,164,.35)} .b-pause{color:var(--warn);border-color:rgba(255,206,90,.35)}
.b-halt{color:var(--bad-ink);border-color:rgba(255,93,114,.35)} .b-mode{color:var(--cyan);border-color:rgba(60,224,255,.3)}
.b-off{color:var(--bad-ink);border-color:var(--bad)}
.statusdot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:7px;vertical-align:middle}
@keyframes blip{0%,100%{opacity:1}50%{opacity:.28}}
.dot-run{background:var(--good);box-shadow:0 0 9px var(--good);animation:blip 1.5s infinite}
.dot-pause{background:var(--warn);box-shadow:0 0 9px var(--warn)}
.dot-halt{background:var(--bad);box-shadow:0 0 9px var(--bad);animation:blip 1.1s infinite}
button{font:inherit;font-weight:600;cursor:pointer;border:1px solid var(--line-2);
  background:linear-gradient(180deg,rgba(34,48,74,.55),rgba(24,36,58,.5));color:var(--ink);
  padding:8px 14px;border-radius:11px;transition:.16s ease;letter-spacing:.02em}
button:hover{border-color:var(--glow);box-shadow:0 0 0 1px rgba(60,224,255,.25),0 0 18px rgba(60,224,255,.22);transform:translateY(-1px)}
button:active{transform:translateY(0)}
button:disabled{cursor:not-allowed;opacity:.45}
button:disabled:hover{border-color:var(--line-2);box-shadow:none;transform:none}
button.primary{background:linear-gradient(100deg,var(--glow-2),var(--glow));color:#03121b;border-color:transparent;font-weight:800;
  box-shadow:0 4px 18px rgba(60,224,255,.3)}
button.primary:hover{box-shadow:0 6px 26px rgba(60,224,255,.5)}
button.danger{background:linear-gradient(100deg,#c31f31,#ff5d72);color:#fff;border-color:transparent;font-weight:800;
  box-shadow:0 4px 18px rgba(255,93,114,.28)}
button.danger:hover{border-color:transparent;box-shadow:0 6px 26px rgba(255,93,114,.5)}
button.ghost{background:transparent;color:var(--ink-2)}
button.mini{padding:6px 12px;font-size:12px;border-radius:9px}
button.on{border-color:var(--glow);color:var(--glow);box-shadow:0 0 14px rgba(60,224,255,.28)}
input,select{font:inherit;color:var(--ink);background:rgba(8,14,24,.72);border:1px solid var(--line-2);
  border-radius:10px;padding:9px 11px;width:100%;transition:.15s}
input:focus,select:focus{outline:none;border-color:var(--glow);box-shadow:0 0 0 3px rgba(60,224,255,.16)}
select{cursor:pointer}
.tabs{display:flex;gap:5px;margin-top:13px;flex-wrap:wrap}
.tab{padding:9px 18px;border-radius:11px;font-weight:600;font-size:13px;color:var(--ink-2);cursor:pointer;
  letter-spacing:.03em;border:1px solid transparent;transition:.16s;position:relative}
.tab:hover{background:rgba(60,224,255,.07);color:var(--ink)}
.tab.active{color:#04121b;font-weight:700;border-color:transparent;
  background:linear-gradient(100deg,var(--glow-2),var(--glow));box-shadow:0 4px 16px rgba(60,224,255,.32)}
.glass{background:linear-gradient(180deg,var(--panel),var(--panel-2));border:1px solid var(--line);
  border-radius:var(--r);backdrop-filter:blur(12px) saturate(1.2);box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.04)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:13px}
.card{padding:16px 18px;position:relative;overflow:hidden}
.card::after{content:"";position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,var(--glow),transparent);opacity:.5}
.card .k{color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;font-weight:600}
.card .v{font-size:24px;font-weight:800;margin-top:6px;font-variant-numeric:tabular-nums;letter-spacing:.5px}
.panel{padding:18px}
table{width:100%;border-collapse:collapse}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);font-size:13px;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:none}
td{color:var(--ink)}
th{color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.tblwrap{overflow-x:auto;border-radius:var(--r)}
.charts{display:grid;grid-template-columns:2fr 1fr;gap:13px}
@media(max-width:820px){.charts{grid-template-columns:1fr}}
.charts .panel{height:310px;display:flex;flex-direction:column;gap:8px}
.charts .panel canvas{flex:1 1 auto;min-height:0}
.chip{font-size:11px;font-weight:700;padding:3px 9px;border-radius:7px;background:rgba(120,150,190,.14);color:var(--muted)}
.chip.ok{background:rgba(38,230,164,.16);color:var(--good-ink)}
.field label{display:block;font-size:12px;color:var(--ink-2);margin-bottom:5px;font-weight:500}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(196px,1fr));gap:13px}
.filterbar{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
#login{max-width:400px;margin:13vh auto;text-align:center}
#login .panel{padding:32px}
.hint{color:var(--muted);font-size:12px;margin-top:12px;line-height:1.6}
.saved{color:var(--good-ink);font-size:13px}
.sats{display:flex;gap:11px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.sat{min-width:112px;padding:11px 13px;border-radius:14px;border:1px solid var(--line);
  background:linear-gradient(180deg,var(--panel-2),var(--panel-3));text-align:center;transition:.18s;backdrop-filter:blur(6px)}
.sat:hover{transform:translateY(-2px);border-color:var(--line-2)}
.sat .s{font-weight:700;font-size:13px}
.sat .p{font-family:'JetBrains Mono';color:var(--ink-2);font-size:12px;margin-top:3px}
.tag{font-size:10px;font-weight:800;padding:2px 8px;border-radius:6px;letter-spacing:.04em}
.tag.long{background:rgba(38,230,164,.18);color:var(--good-ink)} .tag.short{background:rgba(255,93,114,.18);color:var(--bad-ink)}
@keyframes breathe{0%,100%{box-shadow:0 0 44px rgba(60,224,255,.36) inset,0 0 22px rgba(60,224,255,.26)}
  50%{box-shadow:0 0 66px rgba(60,224,255,.62) inset,0 0 38px rgba(60,224,255,.48)}}
canvas{max-width:100%}
::selection{background:rgba(60,224,255,.3);color:#fff}
/* control deck */
.deck{display:grid;grid-template-columns:repeat(auto-fit,minmax(248px,1fr));gap:13px;margin:22px 0 6px}
.ctl{padding:16px 18px;display:flex;flex-direction:column}
.ctl .cl{color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;font-weight:700;margin-bottom:11px;display:flex;align-items:center;gap:8px}
.ctl .cl .cln{color:var(--ink-2);text-transform:none;letter-spacing:0;font-weight:500;font-size:11px}
.ctl .cfoot{color:var(--muted);font-size:11px;margin:11px 0 0;line-height:1.5}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chipbtn{padding:8px 13px;border-radius:11px;border:1px solid var(--line-2);background:rgba(10,16,26,.5);
  font-weight:700;font-size:12.5px;color:var(--ink-2);cursor:pointer;transition:.16s;display:inline-flex;align-items:center;gap:7px}
.chipbtn:hover{border-color:var(--glow);color:var(--ink);box-shadow:0 0 14px rgba(60,224,255,.2)}
.chipbtn.on{background:linear-gradient(100deg,var(--glow-2),var(--glow));color:#04121b;border-color:transparent;box-shadow:0 3px 14px rgba(60,224,255,.28)}
.chipbtn .mi{font-size:14px}
.aitog{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.aitog:last-child{border-bottom:none}
.aitog .lbl{font-size:13px;font-weight:600}
.aitog .sub{font-size:11px;color:var(--muted);margin-top:2px;max-width:210px}
.sw{width:46px;height:26px;border-radius:20px;background:rgba(80,100,130,.32);position:relative;cursor:pointer;transition:.2s;flex:none;border:1px solid var(--line-2)}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:19px;height:19px;border-radius:50%;background:#dfeaff;transition:.2s}
.sw.on{background:linear-gradient(100deg,var(--glow-2),var(--glow));border-color:transparent}
.sw.on::after{left:23px}
.sw.violet.on{background:linear-gradient(100deg,var(--violet),var(--violet-2))}
.mode-seg{display:inline-flex;border:1px solid var(--line-2);border-radius:12px;overflow:hidden;background:rgba(10,16,26,.5)}
.mode-seg button{border:none;border-radius:0;background:transparent;padding:7px 15px;font-size:12px;font-weight:700;letter-spacing:.03em;box-shadow:none}
.mode-seg button:hover{transform:none;box-shadow:none;color:var(--glow)}
.mode-seg button.on{background:linear-gradient(100deg,var(--glow-2),var(--glow));color:#04121b}
.mode-seg button:disabled{color:var(--muted);opacity:.5}
.engine-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:840px){.engine-grid{grid-template-columns:1fr}}
.eng{padding:18px;position:relative;transition:.25s}
.eng.off{opacity:.42;filter:grayscale(.5)}
.eng .ehead{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.eng .ename{font-family:'Orbitron';font-weight:700;letter-spacing:2px;font-size:14px}
.eng .emkt{font-size:10px;color:var(--muted);letter-spacing:.06em}
.orb{width:104px;height:104px;border-radius:50%;margin:6px auto 12px;display:grid;place-items:center;text-align:center;
  background:radial-gradient(circle at 50% 40%,rgba(60,224,255,.34),rgba(8,18,34,.9) 70%);
  box-shadow:0 0 34px rgba(60,224,255,.34) inset,0 0 20px rgba(60,224,255,.26);animation:breathe 3.6s ease-in-out infinite}
.orb.long{background:radial-gradient(circle at 50% 40%,rgba(38,230,164,.42),rgba(6,26,20,.92) 70%);box-shadow:0 0 42px rgba(38,230,164,.5) inset}
.orb.short{background:radial-gradient(circle at 50% 40%,rgba(255,93,114,.42),rgba(30,8,14,.92) 70%);box-shadow:0 0 42px rgba(255,93,114,.5) inset}
.orb.halt{background:radial-gradient(circle at 50% 40%,rgba(255,206,90,.3),rgba(30,24,8,.9) 70%)}
.orb .os{font-family:'Orbitron';font-weight:800;font-size:13px;letter-spacing:1px}
.orb .osub{font-size:10px;color:var(--ink-2);margin-top:3px}
.ekpi{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:6px}
.ekpi .k{color:var(--muted);font-size:9.5px;text-transform:uppercase;letter-spacing:.06em}
.ekpi .v{font-size:16px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:2px}
.modal-bg{position:fixed;inset:0;background:rgba(2,6,14,.74);backdrop-filter:blur(5px);display:grid;place-items:center;z-index:100;padding:20px}
.modal{max-width:500px;width:100%;padding:24px}
.modal h3{margin:0 0 4px;font-size:17px}
.warn-item{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px;line-height:1.5}
.warn-item:last-child{border-bottom:none}
.warn-ic{color:var(--warn);flex:none;font-size:15px}
</style>
</head>
<body>

<div id="login" hidden>
  <div class="glass panel">
    <div class="brand" style="justify-content:center"><span class="spark"></span><span class="mark">TREO</span></div>
    <p class="mut" style="margin:10px 0 20px;letter-spacing:.05em">AUTONOMOUS TRADING · SIGN IN</p>
    <div class="field" style="text-align:left"><label>Email</label>
      <input id="email" type="email" placeholder="you@example.com"></div>
    <div class="field" style="text-align:left;margin-top:10px"><label>Password</label>
      <input id="password" type="password" placeholder="your password" onkeydown="if(event.key==='Enter')signIn()"></div>
    <button class="primary" style="width:100%;margin-top:16px" onclick="signIn()">Enter</button>
    <p class="hint" id="loginMsg">Use the email &amp; password you set up in Supabase.</p>
  </div>
</div>

<div id="app" hidden>
  <div class="appbar"><div class="inner row">
    <div class="brand"><span class="spark"></span><span class="mark">TREO</span></div>
    <span class="badge b-mode" id="envBadge">STAGING · DEMO</span>
    <span id="liveNote" class="mut" style="font-size:12px"></span>
    <span class="spacer"></span>
    <button class="mini danger" onclick="stopAll()">■ Stop &amp; Close All</button>
    <button class="mini ghost" onclick="signOut()">Exit</button>
  </div>
  <div class="inner" style="padding-top:0"><div class="tabs" id="tabs"></div></div></div>
  <div class="wrap"><div id="view"></div></div>
</div>

<div id="modalHost"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="config.js"></script>
<script>
const cfg=window.APP_CONFIG;
const sb=window.supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY);
const TABS=["Command","Trades","Markets","Settings"];
const ENGINES=["spot","futures","forex","stocks"];       // display order
const ROW={futures:1,spot:2,forex:3,stocks:4};
const ID2ENG={1:"futures",2:"spot",3:"forex",4:"stocks"};
const ALLIDS=[1,2,3,4];
const OWNERSHIP=new Set(["spot","stocks"]);              // long-only, hold-to-profit
const MKT={crypto:{label:"Crypto",icon:"₿",engines:["spot","futures"]},
           forex:{label:"Forex",icon:"💱",engines:["forex"]},
           stocks:{label:"US Stocks",icon:"📈",engines:["stocks"]}};
const ENG_MKT={spot:"crypto · Binance",futures:"crypto · Binance",forex:"forex · Capital.com",stocks:"stocks · Alpaca"};
let active="Command";
let E={futures:mk(),spot:mk(),forex:mk(),stocks:mk()};
function mk(){return {S:{},C:{data:{},control:'run',revision:0}};}
let T=[], pnlChart, wlChart, lastTLen=-1, engView='futures';

const DEFAULTS={symbols:'',timeframe:'1m',poll_seconds:10,leverage:1,allow_long:true,allow_short:true,
  score_threshold:3,atr_mult:1.5,min_stop_pct:0.6,trend_ema:200,adx_min:22,use_sr:true,sr_lookback:120,
  sr_pivot_bars:3,sr_near_atr:1.5,sr_min_room_r:1.0,use_fng:true,fng_extreme_greed:78,fng_extreme_fear:22,
  rsi_overbought:78,rsi_oversold:22,use_stop_loss:true,use_exchange_stop:true,breakeven_at_r:1.5,trail_atr_mult:2.5,
  cooldown_minutes:15,risk_per_trade_pct:1,reward_risk:2,max_open_positions:6,daily_loss_limit_pct:0,
  daily_profit_target_pct:0,daily_profit_target_usd:0,daily_loss_limit_usd:0,ema_fast:9,ema_slow:21,rsi_period:14,
  adx_period:14,atr_period:14,min_notional_usdt:11,fee_pct:0.09};

const LABELS={symbols:"Instruments (comma separated)",score_threshold:"Votes needed (2–4)",atr_mult:"Target/stop = ATR ×",
  min_stop_pct:"Min width (%)",trend_ema:"Trend-context EMA (0=off)",adx_min:"Min trend strength ADX (0=off)",
  rsi_overbought:"RSI overbought",rsi_oversold:"RSI oversold",use_sr:"Only enter near a level (S/R)",sr_lookback:"S/R lookback",
  sr_pivot_bars:"S/R pivot strength",sr_near_atr:"“Near a level” = ATR ×",sr_min_room_r:"Min room to opposite level (R)",
  use_fng:"Use Fear & Greed filter",fng_extreme_greed:"Block longs above F&G",fng_extreme_fear:"Block shorts below F&G",
  use_stop_loss:"Use stop-loss",use_exchange_stop:"Stop lives on exchange",breakeven_at_r:"Break-even at R (0=off)",
  trail_atr_mult:"Trail stop = ATR × (0=off)",cooldown_minutes:"Cooldown after loss (min)",risk_per_trade_pct:"Risk per trade (%)",
  reward_risk:"Take-profit = risk ×",max_open_positions:"Max open positions",min_notional_usdt:"Min trade size",
  fee_pct:"Fee per trade (%)",daily_profit_target_usd:"Daily profit target (0=off)",daily_loss_limit_usd:"Daily loss limit (0=off)",
  daily_profit_target_pct:"…or profit target (%)",daily_loss_limit_pct:"…or loss limit (%)",ema_fast:"EMA fast",ema_slow:"EMA slow",
  rsi_period:"RSI period",adx_period:"ADX period",atr_period:"ATR period",leverage:"Leverage (×)"};
const BOOL=new Set(["use_sr","use_fng","use_stop_loss","use_exchange_stop"]);

const POSITION_GROUPS=[
  ["Instruments",["symbols"]],
  ["Daily goals",["daily_profit_target_usd","daily_loss_limit_usd","daily_profit_target_pct","daily_loss_limit_pct"]],
  ["Signal engine",["score_threshold","atr_mult","min_stop_pct","trend_ema","adx_min","rsi_overbought","rsi_oversold","ema_fast","ema_slow","rsi_period","adx_period","atr_period"]],
  ["Support / resistance",["use_sr","sr_lookback","sr_pivot_bars","sr_near_atr","sr_min_room_r"]],
  ["Trade management",["use_stop_loss","use_exchange_stop","breakeven_at_r","trail_atr_mult","cooldown_minutes"]],
  ["Risk & size",["risk_per_trade_pct","reward_risk","max_open_positions","min_notional_usdt","fee_pct"]],
];
const OWNERSHIP_GROUPS=[

function engRunning(e){const c=E[e].C.control;return c!=='pause'&&c!=='stop';}
function staleSecs(S){if(typeof S.updated_ts==='number')return Math.max(0,Math.round(Date.now()/1000-S.updated_ts));
  if(!S.updated)return null;const t=Date.parse(String(S.updated).replace(' ','T')+'Z');
  if(isNaN(t))return null;return Math.max(0,Math.round((Date.now()-t)/1000));}
function engStatus(e){const S=E[e].S, on=engRunning(e), st=staleSecs(S);
  if(st!=null&&st>180) return {txt:'OFFLINE?',dot:'dot-halt',cls:'b-off',orb:'halt',sub:'no data'};
  if(!on) return {txt:'PAUSED',dot:'dot-pause',cls:'b-pause',orb:'halt',sub:'tap market to start'};
  if(S.halted) return {txt:'RESTING',dot:'dot-halt',cls:'b-halt',orb:'halt',sub:S.halt_reason||'daily goal'};
  const sig=S.signals||{}, hot=Object.keys(sig).find(k=>sig[k].signal);
  if(hot){const d=sig[hot].signal;return {txt:d.toUpperCase(),dot:'dot-run',cls:'b-run',orb:d,sub:hot};}
  return {txt:'SCANNING',dot:'dot-run',cls:'b-run',orb:'',sub:(Object.keys(sig).length||'')+' markets'};
}

async function closePos(e,sym){
  if(!confirm(`Close ${sym} on the ${e} engine now, at market?`))return;
  // Append to this engine's close queue (never touches run/pause). The engine
  // market-closes each queued symbol on its next cycle, then trims the queue.
  const data=Object.assign({},E[e].C.data||{});
  const q=Array.isArray(data.close_queue)?data.close_queue.slice():[];
  if(!q.includes(sym))q.push(sym);
  data.close_queue=q;
  const rev=((E[e].C.revision)||0)+1;
  await sb.from('bot_config').update({data:data,revision:rev,updated_at:new Date().toISOString()}).eq('id',ROW[e]);
  await fetchConfigs(); build();
}
function isQueued(e,sym){const q=(E[e].C.data||{}).close_queue||[];return q.includes(sym);}
async function closeAllEngine(e){const syms=Object.keys(E[e].S.positions||{});if(!syms.length)return;
  if(!confirm(`Close ALL ${syms.length} open ${e} position(s) now, at market?`))return;
  const data=Object.assign({},E[e].C.data||{});const q=Array.isArray(data.close_queue)?data.close_queue.slice():[];
  syms.forEach(s=>{if(!q.includes(s))q.push(s);});data.close_queue=q;
  const rev=((E[e].C.revision)||0)+1;
  await sb.from('bot_config').update({data:data,revision:rev,updated_at:new Date().toISOString()}).eq('id',ROW[e]);
  await fetchConfigs();build();}
async function bumpCfg(id,patch){const {data}=await sb.from('bot_config').select('revision').eq('id',id).single();
  const rev=((data&&data.revision)||0)+1;
  return sb.from('bot_config').update({data:patch,revision:rev,updated_at:new Date().toISOString()}).eq('id',id);}

  view.innerHTML=({Command:vCommand,Trades:vTrades,Markets:vMarkets,Settings:vSettings}[active])();
  if(active==='Command')syncCommand();

function live(){

  if(active==='Command'){syncCommand();return;}
  if(active==='Markets'){syncMarkets();return;}

  ENGINES.forEach(e=>{const p=E[e].S.positions||{};Object.keys(p).forEach(s=>{const o=p[s];const side=o.side||'long';
    const u=o.unreal_pct||0;const c=u>=0?'pos':'neg';
    const qty=+o.amount||0, entry=+o.entry||0, now=+(o.now||o.entry)||0;
    const cost=qty*entry, val=qty*now;
    openRows+=`<tr><td><span class="chip">${e}</span></td><td>${s}</td><td class="${side==='long'?'pos':'neg'}"><b>${side.toUpperCase()}</b></td>
      <td>${fmt(qty)}</td><td>${fmt(entry)}</td><td>${fmt(now)}</td>
      <td>$${cost.toFixed(2)}</td><td>$${val.toFixed(2)}</td>
      <td class="${c}">${u>=0?'+':''}${(+u).toFixed(2)}%</td>
      <td>${isQueued(e,s)?'<span class="mut">closing…</span>':`<button class="mini danger" onclick="closePos('${e}','${s}')">Close</button>`}</td></tr>`;});});
  const bar=ENGINES.filter(e=>Object.keys(E[e].S.positions||{}).length)
    .map(e=>`<button class="mini danger" onclick="closeAllEngine('${e}')">Close all ${e} (${Object.keys(E[e].S.positions||{}).length})</button>`).join('');
  let wallet='';
  ENGINES.forEach(e=>{const S=E[e].S;const p=S.positions||{};const n=Object.keys(p).length;const bal=+S.balance||0;
    let inv=0;Object.keys(p).forEach(s=>{const o=p[s];inv+=(+o.amount||0)*(+(o.now||o.entry)||0);});
    if(bal>0||n>0){wallet+=card(e.toUpperCase()+' — invested',`$${inv.toFixed(2)} · ${n} coin${n!=1?'s':''}`)
      +card(e.toUpperCase()+' — free to buy','$'+Math.max(0,bal-inv).toFixed(2));}});
  el('topen').innerHTML=(wallet?`<div class="cards" style="margin-bottom:10px">${wallet}</div>`:'')
    +(openRows?`${bar?`<div class="filterbar">${bar}</div>`:''}<div class="glass panel tblwrap"><table>
    <tr><th>Engine</th><th>Instrument</th><th>Side</th><th>Qty</th><th>Entry</th><th>Now</th><th>Cost&nbsp;$</th><th>Value&nbsp;$</th><th>Unreal.</th><th>Action</th></tr>${openRows}</table></div>`
    :'<p class="mut" style="padding:8px">No open positions right now.</p>');
  const D=trByEng();
  const wins=D.filter(x=>+x.pnl_pct>0),losses=D.filter(x=>+x.pnl_pct<=0);
  const avg=a=>a.length?(a.reduce((s,x)=>s+ +x.pnl_pct,0)/a.length):0;
  const net=D.reduce((s,x)=>s+ +x.pnl_pct,0);
  el('tstats').innerHTML=card('Total',D.length)+card('Win rate',D.length?Math.round(wins.length/D.length*100)+'%':'—')+
    card('Avg win',`<span class="pos">+${avg(wins).toFixed(2)}%</span>`)+card('Avg loss',`<span class="neg">${avg(losses).toFixed(2)}%</span>`)+
    card('Net (sum of trade %)',`<span class="${net>=0?'pos':'neg'}">${net>=0?'+':''}${net.toFixed(2)}%</span>`);
  el('tbreak').innerHTML=D.length?(
    btable('Engine',grp(D,x=>x.engine||'futures'))+btable('Side',grp(D,x=>(x.result||'').split(' ')[0]||null))+
    btable('Instrument',grp(D,x=>x.symbol))+btable('Signal strength',grp(D,x=>{const m=(x.reason||'').match(/(\d)\/4/);return m?m[1]+'/4 votes':null;}))
  ):'<p class="mut" style="padding:8px">Breakdown appears once trades close.</p>';
  let rows=D.slice().reverse();
  if(tf_res==='wins')rows=rows.filter(x=>+x.pnl_pct>0); if(tf_res==='losses')rows=rows.filter(x=>+x.pnl_pct<=0);
  el('thist').innerHTML=rows.length?`<table><tr><th>Time</th><th>Eng</th><th>Instrument</th><th>Entry</th><th>Exit</th><th>Result</th><th>P&L</th><th>Why</th></tr>`+
    rows.map(x=>{const c=+x.pnl_pct>=0?'pos':'neg';return `<tr><td class="mut">${x.ts||''}</td><td><span class="chip">${x.engine||'fut'}</span></td><td>${x.symbol}</td>
      <td>${fmt(x.entry)}</td><td>${fmt(x.exit)}</td><td>${x.result}</td>
      <td class="${c}">${+x.pnl_pct>=0?'+':''}${(+x.pnl_pct).toFixed(2)}%</td><td class="mut">${x.reason||''}</td></tr>`;}).join('')+`</table>`
    :'<p class="mut" style="padding:8px">No closed trades yet for this filter.</p>';
}
function baseOpts(){return {responsive:true,maintainAspectRatio:false,animation:false,
  plugins:{legend:{display:false}},scales:{x:{grid:{color:css('--line')},ticks:{color:css('--muted'),maxTicksLimit:8}},
  y:{grid:{color:css('--line')},ticks:{color:css('--muted')}}}};}
function drawPnl(){const ctx=document.getElementById('pnlChart');if(!ctx)return;const D=trByEng();
  let cum=0;const labels=[],vals=[];D.forEach((x,i)=>{cum+=+x.pnl_pct||0;labels.push(i+1);vals.push(+cum.toFixed(2));});
  if(pnlChart)pnlChart.destroy();
  pnlChart=new Chart(ctx,{type:'line',data:{labels,datasets:[{data:vals,borderColor:css('--series-1'),borderWidth:2,pointRadius:0,tension:.25,fill:true,backgroundColor:'rgba(74,168,255,.12)'}]},options:baseOpts()});}
function drawWL(){const ctx=document.getElementById('wlChart');if(!ctx)return;const D=trByEng();
  const wins=D.filter(x=>+x.pnl_pct>0).length,losses=D.length-wins;
  const note=document.getElementById('wlNote');if(note)note.textContent=D.length?`${wins} wins · ${losses} losses`:'No trades yet';
  if(wlChart)wlChart.destroy();
  wlChart=new Chart(ctx,{type:'doughnut',data:{labels:['Wins','Losses'],datasets:[{data:[wins,losses],backgroundColor:[css('--good'),css('--bad')],borderColor:'#0a0e17',borderWidth:2}]},
    options:{responsive:true,maintainAspectRatio:false,cutout:'62%',animation:false,plugins:{legend:{position:'bottom',labels:{color:css('--ink-2'),boxWidth:12,padding:14}}}}});}

/* ---------- MARKETS ---------- */
function vMarkets(){return `<div id="marketsBox"></div>`;}
function mktTable(e){const S=E[e].S,sig=S.signals||{};
  const rows=Object.keys(sig).map(s=>{const o=sig[s],ind=o.indicators||{},sc=o.score||{long:0,short:0};
    const lean=sc.long>sc.short?'long':(sc.short>sc.long?'short':'—');const mx=Math.max(sc.long,sc.short);
    const bias=lean==='—'?'<span class="mut">flat</span>':`<span class="${lean==='long'?'pos':'neg'}">${lean==='long'?'▲':'▼'} ${lean} ${mx}/4</span>`;
    const read=o.signal?`<span class="${o.signal==='long'?'pos':'neg'}"><b>${o.signal.toUpperCase()}</b></span>`:`<span class="mut">${o.reason||''}</span>`;
    return `<tr><td><b>${s}</b></td><td>${fmt(o.price)}</td><td>${o.rsi!=null?o.rsi:'—'}</td>
      <td class="mut">${ind.support?fmt(ind.support):'—'} / ${ind.resistance?fmt(ind.resistance):'—'}</td><td>${bias}</td><td>${read}</td></tr>`;}).join('')
    ||`<tr><td class="mut" colspan="6">${engRunning(e)?'Waiting for data…':'Engine paused.'}</td></tr>`;
  return `<h2>${e.toUpperCase()} <span class="mut" style="text-transform:none;letter-spacing:0">— ${ENG_MKT[e]}</span></h2>
    <div class="glass panel tblwrap"><table>
    <tr><th>Instrument</th><th>Price</th><th>RSI</th><th>Support / Resist.</th><th>Bias</th><th>Read</th></tr>${rows}</table></div>`;
}
function syncMarkets(){const box=document.getElementById('marketsBox');if(!box)return;box.innerHTML=ENGINES.map(mktTable).join('');}

/* ---------- SETTINGS ---------- */
function setEngView(e){engView=e;build();}
function fieldHTML(k,v){const label=LABELS[k]||k; if(Array.isArray(v))v=v.join(', ');
  if(BOOL.has(k)){const on=(v===true||v==='true');
    return `<div class="field"><label>${label}</label><select data-k="${k}">
      <option value="true" ${on?'selected':''}>On</option><option value="false" ${!on?'selected':''}>Off</option></select></div>`;}
  const type=(typeof v==='number'||!isNaN(parseFloat(v)))&&k!=='symbols'?'number':'text';
  return `<div class="field"><label>${label}</label><input data-k="${k}" type="${type}" ${type==='number'?'step="any"':''} value="${v!=null?v:''}"></div>`;
}
function engineSettingsBlock(e){const c=E[e].C.data||{};const groups=groupsFor(e);
  const inner=groups.map(([title,keys])=>`
    <div style="margin-bottom:12px"><div class="mut" style="font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;margin:10px 0 8px">${title}</div>
      <div class="form-grid">${keys.map(k=>{let v=c[k];if(v==null)v=DEFAULTS[k];return fieldHTML(k,v);}).join('')}</div></div>`).join('');
  return `<div class="glass panel" id="set_${e}">
    <div class="row" style="margin-bottom:6px"><span class="ename" style="font-family:'Orbitron';letter-spacing:2px;font-size:14px">${e.toUpperCase()}</span>
      <span class="emkt" style="font-size:10px;color:var(--muted)">${ENG_MKT[e]}</span>
      <span class="spacer"></span><button class="primary mini" onclick="saveEngine('${e}')">Save ${e}</button></div>
    <div class="saved" id="saved_${e}" hidden style="margin-bottom:8px"></div>
    ${OWNERSHIP.has(e)?'<p class="hint" style="margin:0 0 8px">Ownership engine: long-only, <b>no stop-loss</b> — holds until a take-profit, never sells at a loss.</p>':''}
    ${inner}</div>`;
}
function vSettings(){
  const segs=ENGINES.map(e=>`<button class="${engView===e?'on':''}" onclick="setEngView('${e}')">${e[0].toUpperCase()+e.slice(1)}</button>`).join('');
  return `<h2>Advanced settings <span class="mut" style="text-transform:none;letter-spacing:0">— the dials experienced traders tune</span></h2>
    <div class="glass panel" style="margin-bottom:14px">
      <p class="mut" style="margin:0;font-size:13px">Raw indicators, ratios and risk levers. Everyday controls — <b>markets, style, risk appetite, daily target, AI</b> — live on the <b>Command</b> tab. If unsure, set your <b>Risk appetite</b> there and leave these alone.</p></div>
    <div class="row" style="margin-bottom:14px"><span class="mut" style="font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;margin-right:4px">Editing:</span>
      <span class="mode-seg">${segs}</span></div>
    <div id="setWrap">${engineSettingsBlock(engView)}</div>
    <p class="hint">Changes apply within seconds. A risky change asks you to confirm first.</p>`;
}
function readBlock(e){const box=document.getElementById('set_'+e);const patch={};
  box.querySelectorAll('[data-k]').forEach(el=>{const k=el.getAttribute('data-k');
    if(BOOL.has(k)){patch[k]=el.value==='true';return;}
    if(el.type==='number'){if(el.value.trim()==='')return;patch[k]=Number(el.value);return;}
    patch[k]=el.value;});
  return patch;}
function riskWarnings(e,p){const w=[];const own=OWNERSHIP.has(e);
  if(!own){
    if(+p.leverage>3)w.push(`Leverage ${p.leverage}× multiplies every move — a ${(100/p.leverage).toFixed(0)}% adverse swing can wipe the position.`);
    if(p.use_stop_loss===false)w.push(`Stop-loss OFF: a losing trade has no automatic exit, so losses can run without limit.`);
    if(+p.reward_risk<1)w.push(`Reward:risk below 1 means winners are smaller than losers — hard to be profitable.`);
  }
  if(+p.score_threshold&&+p.score_threshold<3)w.push(`Votes needed = ${p.score_threshold}: it will trade far more often — more noise and more fees.`);
  if(+p.risk_per_trade_pct>3)w.push(`Risking ${p.risk_per_trade_pct}% per trade is aggressive; a losing streak draws the balance down fast.`);
  return w;}
function modal(html){document.getElementById('modalHost').innerHTML=html;}
function closeModal(){document.getElementById('modalHost').innerHTML='';}
let _pending=null;
async function saveEngine(e){const patch=readBlock(e);const w=riskWarnings(e,patch);
  if(w.length){_pending={e,patch};
    modal(`<div class="modal-bg"><div class="glass modal"><h3>⚠️ Heads up before saving ${e}</h3>
      <p class="mut" style="font-size:13px;margin:4px 0 12px">This change could hurt more than help:</p>
      ${w.map(x=>`<div class="warn-item"><span class="warn-ic">▲</span><span>${x}</span></div>`).join('')}
      <div class="row" style="margin-top:16px"><button class="danger" onclick="confirmSave()">Save anyway</button>
        <button class="ghost" onclick="closeModal()">Cancel</button></div></div></div>`);
    return;}
  await commitSave(e,patch);
}
async function confirmSave(){if(_pending){await commitSave(_pending.e,_pending.patch);_pending=null;}closeModal();}
async function commitSave(e,patch){
  const {data}=await sb.from('bot_config').select('revision').eq('id',ROW[e]).single();
  const rev=((data&&data.revision)||0)+1;
  const {error}=await sb.from('bot_config').update({data:patch,revision:rev,updated_at:new Date().toISOString()}).eq('id',ROW[e]);
  await fetchConfigs();
  const m=document.getElementById('saved_'+e);if(m){m.hidden=false;
    m.innerHTML=error?('<span class="neg">Error: '+error.message+'</span>'):'<span class="pos">Saved ✓</span> — applied within seconds.';
    setTimeout(()=>{if(m)m.hidden=true},4000);}
}

const login=document.getElementById('login'),app=document.getElementById('app'),tabs=document.getElementById('tabs'),
  view=document.getElementById('view'),email_=document.getElementById('email'),
  password_=document.getElementById('password'),loginMsg=document.getElementById('loginMsg');
boot();
</script>
